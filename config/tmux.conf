# ============================================================
# ~/.tmux.conf — Helix · Catppuccin Mocha
# ============================================================

# ── True color ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"
set -g allow-passthrough on

# ── General ───────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -sg repeat-time 600

# ── Mouse ─────────────────────────────────────────────────────
set -g mouse on

# ── Copiar (vi mode) ──────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line

# Copiar limpio (sin ANSI) — detecta Linux vs Mac
bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel \
  "sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tr -d '\r' | { command -v pbcopy &>/dev/null && pbcopy || command -v xclip &>/dev/null && xclip -sel clip || command -v wl-copy &>/dev/null && wl-copy || cat > /tmp/tmux-clipboard; }"

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel \
  "sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tr -d '\r' | { command -v pbcopy &>/dev/null && pbcopy || command -v xclip &>/dev/null && xclip -sel clip || command -v wl-copy &>/dev/null && wl-copy || cat > /tmp/tmux-clipboard; }"

# ── Prefijo ───────────────────────────────────────────────────
set -g prefix2 C-a
bind C-a send-prefix -2

# ── Keybinds ──────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "✓ ~/.tmux.conf recargado"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ── Status bar (1 línea, top) ─────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#181825 fg=#cdd6f4"

# Left: session activa en purple, ventanas en muted
set -g status-left-length 80
set -g status-left "#[fg=#cba6f7,bold] ● #S  #[fg=#585b70,nobold]#{W:#{E:window-status-format},#{E:window-status-current-format}}"

set -g window-status-format "#[fg=#585b70]#I:#W  "
set -g window-status-current-format "#[fg=#cba6f7,bold]#I:#W  "
set -g window-status-separator ""

# Right: hora en green
set -g status-right-length 30
set -g status-right "#[fg=#a6e3a1] %H:%M "

# ── Bordes de pane ───────────────────────────────────────────
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top
set -g pane-border-format "#[fg=#cba6f7] #{pane_title} #[fg=#585b70]│ #{pane_current_command} "

# ── Mensajes ─────────────────────────────────────────────────
set -g message-style "bg=#11111b fg=#f9e2af"
set -g message-command-style "bg=#11111b fg=#89b4fa"
