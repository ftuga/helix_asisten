# ══════════════════════════════════════════════════════════════
# ~/.tmux.conf — Helix · Catppuccin Mocha
# ══════════════════════════════════════════════════════════════

# ── True color ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB"
set -g allow-passthrough on

# ── General ───────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g display-time 2000

# ── Mouse ─────────────────────────────────────────────────────
set -g mouse on

# ── Copiar (vi mode) ──────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel \
  "sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tr -d '\r' | { command -v xclip &>/dev/null && xclip -sel clip; } || true"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
  "sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tr -d '\r' | { command -v xclip &>/dev/null && xclip -sel clip; } || true"

# ── Prefijos ──────────────────────────────────────────────────
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2

# ── Keybinds ──────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message " tmux.conf recargado"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind x kill-pane
bind & kill-window

# ── Colores base ──────────────────────────────────────────────
# bg=#1e1e2e  surface=#181825  overlay=#313244
# blue=#89b4fa  purple=#cba6f7  green=#a6e3a1
# yellow=#f9e2af  red=#f38ba8  muted=#585b70
# text=#cdd6f4  subtext=#a6adc8

# ── Status bar ────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style                "bg=#181825 fg=#cdd6f4"

# LEFT — ▊ HELIX  session
set -g status-left-length 40
set -g status-left \
  "#[fg=#1e1e2e,bg=#89b4fa,bold] ▊ HELIX #[fg=#89b4fa,bg=#313244,nobold]#[fg=#cdd6f4,bg=#313244] #S #[fg=#313244,bg=#181825]  "

# WINDOWS — centro
set -g window-status-style          "fg=#585b70 bg=#181825"
set -g window-status-current-style  "fg=#89b4fa bg=#181825 bold"
set -g window-status-format         " #I #W "
set -g window-status-current-format " #[fg=#89b4fa]#I #W#[fg=#585b70] "
set -g window-status-separator      "#[fg=#313244]│"

# RIGHT — git branch  hora
set -g status-right-length 60
set -g status-right \
  "#[fg=#313244,bg=#181825]#[fg=#cdd6f4,bg=#313244] #{pane_current_path} #[fg=#89b4fa,bg=#313244]#[fg=#181825,bg=#89b4fa,bold] #(git -C #{pane_current_path} branch --show-current 2>/dev/null || echo '—') #[fg=#89b4fa,bg=#a6e3a1]#[fg=#1e1e2e,bg=#a6e3a1,bold] %H:%M "

# ── Pane borders ──────────────────────────────────────────────
set -g pane-border-style            "fg=#313244"
set -g pane-active-border-style     "fg=#89b4fa"
set -g pane-border-lines            single
set -g pane-border-status           top
set -g pane-border-format \
  "#[fg=#313244]─#[fg=#585b70,bold] #{pane_title} #[fg=#313244,nobold]─#[fg=#585b70] #{pane_current_command} #[fg=#313244]─"

# Pane activo: título en azul
set -g pane-active-border-style     "fg=#89b4fa"

# ── Mensajes y modo de copia ──────────────────────────────────
set -g message-style                "fg=#f9e2af bg=#313244 bold"
set -g message-command-style        "fg=#89b4fa bg=#313244"
set -g mode-style                   "fg=#1e1e2e bg=#cba6f7 bold"
