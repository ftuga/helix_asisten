# ============================================================
# ~/.tmux.conf — Helix · Catppuccin Mocha
# ============================================================

# ── Colores ──────────────────────────────────────────────────
bg="#1e1e2e"
bar="#181825"
bar2="#11111b"
blue="#89b4fa"
purple="#cba6f7"
green="#a6e3a1"
yellow="#f9e2af"
red="#f38ba8"
muted="#585b70"
subtle="#45475a"
text="#cdd6f4"

# ── General ───────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -sg repeat-time 600
set -g allow-passthrough on

# ── Mouse ─────────────────────────────────────────────────────
set -g mouse on

# ── Copiar (vi mode) ──────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line

# Copiar limpio (sin ANSI) — detecta Linux vs Mac
bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel \
  "sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tr -d '\r' | if-shell 'uname | grep -q Darwin' 'pbcopy' 'xclip -sel clip 2>/dev/null || wl-copy 2>/dev/null || cat > /tmp/tmux-clipboard'"

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel \
  "sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tr -d '\r' | if-shell 'uname | grep -q Darwin' 'pbcopy' 'xclip -sel clip 2>/dev/null || wl-copy 2>/dev/null || cat > /tmp/tmux-clipboard'"

# ── Prefijo ───────────────────────────────────────────────────
set -g prefix2 C-a
bind C-a send-prefix -2

# ── Keybinds ──────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "✓ ~/.tmux.conf recargado"

# Splits manteniendo path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegación vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ── Status bar ────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=${bar}"

# Left: session + git branch
set -g status-left-length 60
set -g status-left "#[fg=${blue},bold] ⬡ #S #[fg=${muted},nobold]│#[fg=${purple}] #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null || echo '—') #[fg=${muted}]│ "

# Right: hora + prefix activo
set -g status-right-length 60
set -g status-right "#[fg=${muted}]#{?client_prefix,#[fg=${yellow}bold]⌨ PREFIX  ,}#[fg=${muted},nobold]%H:%M  %d %b "

# Ventanas
set -g window-status-format "#[fg=${muted}] #I:#W "
set -g window-status-current-format "#[fg=${blue},bold] #I:#W "
set -g window-status-style "bg=${bar}"
set -g window-status-current-style "bg=${bar},bold"

# ── Bordes de pane ───────────────────────────────────────────
set -g pane-border-style "fg=${subtle}"
set -g pane-active-border-style "fg=${blue}"
set -g pane-border-status top
set -g pane-border-format "#[fg=${muted}] #{pane_title} #[fg=${subtle}]│ #{pane_current_command} "

# ── Mensajes ─────────────────────────────────────────────────
set -g message-style "bg=${bar2},fg=${yellow}"
set -g message-command-style "bg=${bar2},fg=${blue}"
