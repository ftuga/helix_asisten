# ═══════════════════════════════════════════════════════════════
# ~/.tmux.conf — Helix tmux theme v2.0
# Paleta: Catppuccin Mocha  |  Requiere tmux ≥ 2.9
# ═══════════════════════════════════════════════════════════════

# ── Terminal y color ──────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB:UTF-8"
set -ag terminal-overrides ",xterm-256color:RGB:UTF-8"

# ── Comportamiento base ───────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 10000
set -g focus-events on
set -g status-interval 5

# ── Status bar — posición y estilo ───────────────────────────
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#181825 fg=#cdd6f4"

# Left: icono + nombre de sesión
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] ⬡ #S #[bg=#181825,fg=#89b4fa,nobold]  "

# Right: hora y fecha
set -g status-right-length 40
set -g status-right "#[fg=#6c7086] %H:%M  #[fg=#cdd6f4]%a %d %b "

# Ventanas en el tab bar
setw -g window-status-current-style "fg=#89b4fa bold"
setw -g window-status-current-format " #W "
setw -g window-status-style "fg=#6c7086"
setw -g window-status-format " #W "
setw -g window-status-separator ""

# ── Bordes de paneles ─────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Títulos sobre cada panel — muestra posición de scroll en copy mode
set -g pane-border-status top
set -g pane-border-format "#[fg=#89b4fa,bold] #{pane_title} #[fg=#f38ba8]#{?pane_in_mode, [scroll: -#{scroll_position}],} "

# ── Mensajes del sistema ──────────────────────────────────────
set -g message-style "bg=#313244 fg=#cdd6f4"
set -g message-command-style "bg=#313244 fg=#cba6f7"

# ── Status right: indicador SCROLL activo ────────────────────
set -g status-right "#[fg=#f38ba8,bold]#{?pane_in_mode, SCROLL ,}#[fg=#6c7086,nobold] %H:%M  #[fg=#cdd6f4]%a %d %b "

# ── Scroll y Copy mode ────────────────────────────────────────
# Vi keys en copy mode (Ctrl+B [ para entrar, q para salir)
setw -g mode-keys vi
set -g mode-style "bg=#313244 fg=#cdd6f4"

# Velocidad de scroll: 3 líneas por tick de mouse
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
# Al llegar al fondo (scroll_position=0) sale de copy mode automáticamente → vuelve al prompt
bind -T copy-mode-vi WheelDownPane if -F "#{==:#{scroll_position},0}" \
  "send-keys -X cancel" \
  "send-keys -X -N 3 scroll-down"

# Selección visual con vi (v=caracter, V=línea, Ctrl+v=bloque)
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Clipboard: detecta WSL2 (PowerShell para UTF-8 correcto) o Linux nativo
if-shell "command -v clip.exe" {
  bind -T copy-mode-vi y                send-keys -X copy-pipe-and-cancel "powershell.exe -command '\$input | Set-Clipboard'"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "powershell.exe -command '\$input | Set-Clipboard'"
} {
  bind -T copy-mode-vi y                send-keys -X copy-pipe-and-cancel "xclip -sel clip 2>/dev/null || xsel --clipboard --input"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -sel clip 2>/dev/null || xsel --clipboard --input"
}

# ── Atajos de teclado ─────────────────────────────────────────
# Prefijo estándar: Ctrl+B (sin cambios)
bind r source-file ~/.tmux.conf \; display "⬡ tmux.conf recargado"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
