# ═══════════════════════════════════════════════════════════════
# ~/.tmux.conf — Helix tmux theme v2.0
# Paleta: Catppuccin Mocha  |  Requiere tmux ≥ 2.9
# ═══════════════════════════════════════════════════════════════

# ── Terminal y color ──────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Comportamiento base ───────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 10000
set -g focus-events on
set -g status-interval 5

# ── Status bar — posición y estilo ───────────────────────────
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#181825 fg=#cdd6f4"

# Left: icono + nombre de sesión
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] ⬡ #S #[bg=#181825,fg=#89b4fa,nobold]  "

# Right: hora y fecha
set -g status-right-length 40
set -g status-right "#[fg=#6c7086] %H:%M  #[fg=#cdd6f4]%a %d %b "

# Ventanas en el tab bar
setw -g window-status-current-style "fg=#89b4fa bold"
setw -g window-status-current-format " #W "
setw -g window-status-style "fg=#6c7086"
setw -g window-status-format " #W "
setw -g window-status-separator ""

# ── Bordes de paneles ─────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Títulos sobre cada panel (tmux ≥ 2.6)
set -g pane-border-status top
set -g pane-border-format "#[fg=#89b4fa,bold] #{pane_title} "

# ── Mensajes del sistema ──────────────────────────────────────
set -g message-style "bg=#313244 fg=#cdd6f4"
set -g message-command-style "bg=#313244 fg=#cba6f7"

# ── Atajos de teclado ─────────────────────────────────────────
# Prefijo estándar: Ctrl+B (sin cambios)
bind r source-file ~/.tmux.conf \; display "⬡ tmux.conf recargado"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
